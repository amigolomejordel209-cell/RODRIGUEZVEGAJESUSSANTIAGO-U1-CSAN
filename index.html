<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio de Evidencias - Ciberseguridad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Anti-Clickjacking Script (Rompe Marcos / iFrames) -->
    <script>
      if (window.top !== window.self) {
        window.top.location = window.self.location;
      }
    </script>

    <!-- Content Security Policy (CSP) Ajustada y Compatible con Firebase -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://www.gstatic.com https://*.firebaseapp.com https://*.googleapis.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://www.gstatic.com https://*.firebaseapp.com;
        img-src 'self' data:;
    ">

    <!-- Prevenir adivinación del tipo MIME -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
</head>
<body>

    <!-- Pantalla de Login -->
    <div id="login-container" class="container align-center">
        <div class="login-box glass-card">
            <div class="shield-icon">🔒</div>
            <h2>Acceso Restringido</h2>
            <p class="subtitle">Portal de Evidencias & Ciberseguridad</p>
            
            <form id="login-form">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="usuario@dominio.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••••••" required>
                </div>
                <button type="submit" id="login-btn" class="btn-primary">Autenticar Sistema</button>
                <p id="error-message" class="error-msg"></p>
            </form>
        </div>
    </div>

    <!-- Contenedor del Portafolio (VACÍO EN EL DOM INICIAL) -->
    <div id="portfolio-container" class="container hidden"></div>

    <!-- Firebase SDK & Lógica de Seguridad -->
    <script type="module" src="app.js"></script>
</body>
</html>
